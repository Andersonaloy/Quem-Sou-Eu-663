<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Quem Sou Eu?</title>
  <desc id="desc">Ícone do jogo com balão de pergunta roxo e selo verde de resposta.</desc>
  <defs>
    <linearGradient id="bg" x1="55" y1="28" x2="462" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211333"/>
      <stop offset=".55" stop-color="#120D1D"/>
      <stop offset="1" stop-color="#0A0712"/>
    </linearGradient>
    <linearGradient id="purple" x1="93" y1="76" x2="405" y2="418" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A77AF0"/>
      <stop offset="1" stop-color="#7543C4"/>
    </linearGradient>
    <linearGradient id="green" x1="346" y1="339" x2="461" y2="459" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21A65A"/>
      <stop offset="1" stop-color="#168548"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset dy="9" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.04 0 0 0 0 0.02 0 0 0 0 0.08 0 0 0 .65 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bg)" stroke="#7543C4" stroke-width="12"/>
  <rect x="28" y="28" width="456" height="456" rx="101" fill="none" stroke="#A77AF0" stroke-opacity=".16" stroke-width="3"/>
  <circle cx="256" cy="235" r="156" fill="#7543C4" opacity=".16" filter="url(#purpleGlow)"/>
  <path d="M104 151c0-39 32-71 71-71h162c39 0 71 32 71 71v130c0 39-32 71-71 71H231l-83 70v-77c-26-12-44-38-44-68z" fill="url(#purple)" filter="url(#shadow)"/>
  <path d="M189 196c5-39 33-63 72-63 42 0 72 25 72 64 0 29-15 47-43 66-23 16-30 27-30 50" fill="none" stroke="#fff" stroke-width="27" stroke-linecap="round"/>
  <circle cx="260" cy="360" r="16" fill="#E8BB55"/>
  <circle cx="394" cy="389" r="75" fill="url(#green)" stroke="#0A0712" stroke-width="15" filter="url(#shadow)"/>
  <path d="m358 390 24 24 49-53" fill="none" stroke="#fff" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M91 424h100" stroke="#A77AF0" stroke-width="9" stroke-linecap="round" opacity=".55"/>
  <path d="M91 453h62" stroke="#21A65A" stroke-width="9" stroke-linecap="round" opacity=".8"/>
